<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KINDLY FORWARD — Character Creator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑‍🎨</text></svg>" />
<style>
  * { box-sizing: border-box; }
  html, body, #app { height: 100%; margin: 0; }
  body { background: #1e1914; color: #e8dfc8; font: 14px/1.5 Baskerville, 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; }
  #app { display: flex; flex-direction: column; }
  .cg-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #2c2620; border-bottom: 2px solid #9a7f4e; flex-wrap: wrap; }
  .cg-top b { letter-spacing: .08em; }
  .cg-top .sub { color: #c9b98f; font-size: 13px; }
  .cg-top a { color: #e8d9a8; text-decoration: none; font-size: 13px; margin-left: auto; }
  .cg-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
  .cg-side { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-left: 1px solid #4a3f30; background: #241f1a; min-height: 0; overflow-y: auto; }
  .cg-side h3 { margin: 4px 0 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #c9b98f; font-weight: normal; }
  .cg-side input, .cg-side select, .cg-side textarea { width: 100%; font: 12px/1.4 ui-monospace, monospace; color: #e8dfc8; background: #16120e; border: 1px solid #4a3f30; border-radius: 6px; padding: 6px 8px; }
  .cg-side textarea { flex: 1; min-height: 220px; resize: vertical; }
  .cg-side button, .cg-main .cc-footer button { font: inherit; color: #e8dfc8; background: #3a332b; border: 1px solid #6a5a40; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .cg-side .row { display: flex; gap: 6px; }
  .cg-note { color: #a89a7c; font-size: 12px; margin: 0; }
  .cg-status { font: 12px ui-monospace, monospace; color: #c9b98f; min-height: 1.4em; }
  @media (max-width: 1000px) { .cg-main { grid-template-columns: 1fr; } .cg-side { border-left: 0; border-top: 1px solid #4a3f30; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/chargen/main.tsx"></script>
</body>
</html>
