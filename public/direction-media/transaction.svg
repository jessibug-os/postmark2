<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 465" role="img" aria-labelledby="title desc"><title id="title">One-time actions and durable state</title><desc id="desc">Validation precedes mutation; effects and receipt share one snapshot; A/B generations preserve a valid prior save. Retry does not reapply rewards.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#263e39"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="35" font-size="21" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="28" dy="0">One-time actions and durable state</tspan></text><rect x="30" y="80" width="270" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="48" y="110" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="48" dy="0">1 / Validate command</tspan></text><text x="48" y="137" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">run state · capacity · balance</tspan><tspan x="48" dy="17.55">reject without side effects</tspan></text><path d="M300,130 L340,130" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="80" width="270" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="368" y="110" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="368" dy="0">2 / Prepare next snapshot</tspan></text><text x="368" y="137" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="368" dy="0">reward + completion + receipt</tspan><tspan x="368" dy="17.55">same revision / stable command ID</tspan></text><path d="M620,130 L660,130" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="80" width="270" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="688" y="110" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="688" dy="0">3 / Write inactive generation</tspan></text><text x="688" y="137" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="688" dy="0">serialize + checksum + readback</tspan><tspan x="688" dy="17.55">preserve previous generation</tspan></text><path d="M800,185 L800,245" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="255" width="270" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="688" y="285" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="688" dy="0">4 / Switch head pointer</tspan></text><text x="688" y="312" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="688" dy="0">commit this exact generation</tspan><tspan x="688" dy="17.55">then report save success</tspan></text><path d="M670,305 L625,305" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="255" width="270" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="368" y="285" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="368" dy="0">5 / Notify presentation</tspan></text><text x="368" y="312" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="368" dy="0">job:settled / purchase complete</tspan><tspan x="368" dy="17.55">animate result, do not pay again</tspan></text><rect x="30" y="255" width="270" height="105" rx="5" fill="#f0ded2" stroke="#c4cec2"/><text x="48" y="285" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="48" dy="0">If saving fails</tspan></text><text x="48" y="312" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">keep in-memory pending snapshot</tspan><tspan x="48" dy="17.55">retry save, never rerun reward</tspan></text><text x="30" y="420" font-size="14" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Duplicate settlement returns the existing receipt. Cleanup only releases camera, input, and reservations.</tspan><tspan x="30" dy="18.900000000000002">On load, a valid head wins over an orphan uncommitted generation; recovery is visible to the player.</tspan></text></g></svg>