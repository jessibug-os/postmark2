<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" role="img" aria-labelledby="title desc"><title id="title">Boot and ownership boundaries</title><desc id="desc">Configure content before import-time world construction. Controllers call state-owning systems; saves and presentation follow committed commands.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#263e39"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="35" font-size="21" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="28" dy="0">Boot and ownership boundaries</tspan></text><rect x="30" y="70" width="240" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="48" y="100" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="48" dy="0">Entry / BootstrapContext</tspan></text><text x="48" y="127" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">content + map + namespace</tspan><tspan x="48" dy="17.55">selected before importing Game</tspan></text><path d="M270,120 L315,120" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="70" width="250" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="338" y="100" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="338" dy="0">Game / composition root</tspan></text><text x="338" y="127" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="338" dy="0">construct selected systems</tspan><tspan x="338" dy="17.55">retain controller boundaries</tspan></text><path d="M570,120 L615,120" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="70" width="300" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="638" y="100" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="638" dy="0">World + content adapters</tspan></text><text x="638" y="127" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">mapConstants / activePack</tspan><tspan x="638" dy="17.55">consume the frozen context</tspan></text><path d="M445,175 L445,220" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="225" width="250" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="338" y="255" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="338" dy="0">Controllers / commands</tspan></text><text x="338" y="282" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="338" dy="0">input → validate → apply</tspan><tspan x="338" dy="17.55">no UI-owned progression</tspan></text><path d="M320,275 L275,275" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="225" width="240" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="48" y="255" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="48" dy="0">Systems own state</tspan></text><text x="48" y="282" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">clock · jobs · residents</tspan><tspan x="48" dy="17.55">housing · social events</tspan></text><path d="M570,275 L615,275" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="225" width="300" height="105" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="638" y="255" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="638" dy="0">Snapshot / persistence</tspan></text><text x="638" y="282" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="638" dy="0">one revision with effects + receipt</tspan><tspan x="638" dy="17.55">save success is explicit</tspan></text><path d="M445,330 L445,375" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="380" width="600" height="90" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="338" y="410" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="338" dy="0">Committed events → presentation</tspan></text><text x="338" y="437" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="338" dy="0">HUD · dialogue · audio · animations; notifications never pay wages</tspan></text><text x="30" y="423" font-size="14" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Retain rendering, asset loading,</tspan><tspan x="30" dy="18.900000000000002">island and scene authoring.</tspan><tspan x="30" dy="18.900000000000002">Do not create a second engine.</tspan></text></g></svg>