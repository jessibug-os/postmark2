<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 490" role="img" aria-labelledby="title desc"><title id="title">One compact daily loop, with places beyond it</title><desc id="desc">The harbor loop joins dock, home and café; beach, bathhouse and observatory branch from and return to the town.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#263e39"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="35" font-size="21" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="28" dy="0">One compact daily loop, with places beyond it</tspan></text><path d="M180 165L430 165" stroke="#62736a" stroke-width="4" fill="none"/><path d="M560 165L780 165" stroke="#62736a" stroke-width="4" fill="none"/><path d="M430 165L430 340" stroke="#62736a" stroke-width="4" fill="none"/><path d="M180 165L180 340" stroke="#62736a" stroke-width="4" fill="none"/><path d="M780 165L780 340" stroke="#62736a" stroke-width="4" fill="none"/><path d="M430 340L780 340" stroke="#62736a" stroke-width="4" fill="none"/><path d="M560 165L560 65" stroke="#62736a" stroke-width="4" fill="none"/><rect x="45" y="115" width="230" height="95" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="63" y="145" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="63" dy="0">Dock / repair yard</tspan></text><text x="63" y="172" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="63" dy="0">arrival · Ada · delivery depot</tspan></text><rect x="320" y="115" width="250" height="95" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="338" y="145" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="338" dy="0">Bakery + upstairs room</tspan></text><text x="338" y="172" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="338" dy="0">Basil · home · Pip next door</tspan></text><rect x="655" y="115" width="230" height="95" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="673" y="145" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="673" dy="0">Café + secondhand shop</tspan></text><text x="673" y="172" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="673" dy="0">June · work · daily purchases</tspan></text><rect x="45" y="300" width="230" height="90" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="63" y="330" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="63" dy="0">Beach loop</tspan></text><text x="63" y="357" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="63" dy="0">quiet spot · leisure</tspan></text><rect x="320" y="300" width="250" height="90" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="338" y="330" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="338" dy="0">Bathhouse + allotment</tspan></text><text x="338" y="357" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="338" dy="0">cards · Nell · shared project</tspan></text><rect x="655" y="300" width="230" height="90" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="673" y="330" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="673" dy="0">Hill / observatory</tspan></text><text x="673" y="357" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="673" dy="0">Omar · club · evening view</tspan></text><text x="30" y="445" font-size="14" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Topology only. Author actual paths and entrance anchors in little-harbor-v1.island.</tspan><tspan x="30" dy="18.900000000000002">Slice: dock → bakery → café loop. Target 20–35 seconds walking; measure with current player speed.</tspan></text></g></svg>