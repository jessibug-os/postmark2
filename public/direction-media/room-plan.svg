<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" role="img" aria-labelledby="title desc"><title id="title">Starter room / placement rules</title><desc id="desc">A 6 by 5 metre room has half-metre placement cells and a connected access lane from door to bed. Furniture placement validates bounds, overlap and reachability.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#263e39"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="35" font-size="21" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="28" dy="0">Starter room / placement rules</tspan></text><text x="36" y="74" font-size="15" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="36" dy="0">6 m wide × 5 m deep · 0.5 m placement cells</tspan></text><path d="M60 110V510" stroke="#c4cec2"/><path d="M100 110V510" stroke="#c4cec2"/><path d="M140 110V510" stroke="#c4cec2"/><path d="M180 110V510" stroke="#c4cec2"/><path d="M220 110V510" stroke="#c4cec2"/><path d="M260 110V510" stroke="#c4cec2"/><path d="M300 110V510" stroke="#c4cec2"/><path d="M340 110V510" stroke="#c4cec2"/><path d="M380 110V510" stroke="#c4cec2"/><path d="M420 110V510" stroke="#c4cec2"/><path d="M460 110V510" stroke="#c4cec2"/><path d="M500 110V510" stroke="#c4cec2"/><path d="M540 110V510" stroke="#c4cec2"/><path d="M60 110H540" stroke="#c4cec2"/><path d="M60 150H540" stroke="#c4cec2"/><path d="M60 190H540" stroke="#c4cec2"/><path d="M60 230H540" stroke="#c4cec2"/><path d="M60 270H540" stroke="#c4cec2"/><path d="M60 310H540" stroke="#c4cec2"/><path d="M60 350H540" stroke="#c4cec2"/><path d="M60 390H540" stroke="#c4cec2"/><path d="M60 430H540" stroke="#c4cec2"/><path d="M60 470H540" stroke="#c4cec2"/><path d="M60 510H540" stroke="#c4cec2"/><rect x="60" y="110" width="480" height="400" fill="none" stroke="#263e39" stroke-width="3"/><path d="M440 510V410H260V270H180" stroke="#96ae88" stroke-width="34" fill="none" opacity=".65"/><rect x="70" y="125" width="100" height="180" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="88" y="155" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="88" dy="0">BED</tspan></text><rect x="340" y="150" width="150" height="95" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="358" y="180" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="358" dy="0">TABLE</tspan></text><rect x="70" y="365" width="110" height="80" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="88" y="395" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="88" dy="0">STORAGE</tspan></text><text x="190" y="266" font-size="12" fill="#263e39" font-weight="normal" text-anchor="start"><tspan x="190" dy="0">bed access</tspan><tspan x="190" dy="16.200000000000003">reserved</tspan></text><text x="380" y="475" font-size="12" fill="#263e39" font-weight="normal" text-anchor="start"><tspan x="380" dy="0">door approach</tspan></text><path d="M410 510H470" stroke="#f5f1e8" stroke-width="8"/><text x="440" y="540" font-size="13" fill="#263e39" font-weight="bold" text-anchor="middle"><tspan x="440" dy="0">DOOR</tspan></text><path d="M300 110H450" stroke="#6d9297" stroke-width="9"/><text x="375" y="98" font-size="12" fill="#263e39" font-weight="normal" text-anchor="middle"><tspan x="375" dy="0">WINDOW</tspan></text><text x="600" y="150" font-size="18" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="600" dy="0">Before commit:</tspan></text><text x="600" y="185" font-size="15" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="600" dy="0">1. Check footprint bounds.</tspan><tspan x="600" dy="20.25">2. Check object overlap.</tspan><tspan x="600" dy="20.25">3. Reserve usable approach cells.</tspan><tspan x="600" dy="20.25">4. Flood-fill from entry.</tspan><tspan x="600" dy="20.25">5. Require bed + exit access.</tspan></text><text x="600" y="355" font-size="15" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="600" dy="0">Save local coordinates + place ID.</tspan><tspan x="600" dy="20.25">This drawing is an example layout.</tspan><tspan x="600" dy="20.25">Furniture can move; access cannot</tspan><tspan x="600" dy="20.25">be blocked by the final placement.</tspan></text></g></svg>