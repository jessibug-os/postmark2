<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 465" role="img" aria-labelledby="title desc"><title id="title">The day belongs to the simulation clock</title><desc id="desc">Free play advances time; modal states pause it; sleep performs one day rollover and durable save before morning.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#263e39"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e8"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="35" font-size="21" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="28" dy="0">The day belongs to the simulation clock</tspan></text><rect x="35" y="85" width="245" height="100" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="53" y="115" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="53" dy="0">FREE PLAY</tspan></text><text x="53" y="142" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="53" dy="0">advance 0.5 game min / real sec</tspan><tspan x="53" dy="17.55">07:00–23:00 ≈ 32 real minutes</tspan></text><path d="M280,135 L340,135" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="85" width="245" height="100" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="368" y="115" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="368" dy="0">PAUSED</tspan></text><text x="368" y="142" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="368" dy="0">dialogue · menus · placement</tspan><tspan x="368" dy="17.55">scene · transition · hidden tab</tspan></text><text x="300" y="120" font-size="12" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="300" dy="0">open</tspan></text><path d="M350,165 L285,165" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="187" font-size="12" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="300" dy="0">close</tspan></text><path d="M160,185 L160,255" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="265" width="245" height="100" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="53" y="295" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="53" dy="0">EVENING HOLD / SLEEP</tspan></text><text x="53" y="322" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="53" dy="0">at 23:00: stay in control</tspan><tspan x="53" dy="17.55">sleep: explicit confirmation</tspan></text><path d="M280,315 L340,315" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="265" width="245" height="100" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="368" y="295" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="368" dy="0">DAY ROLLOVER</tspan></text><text x="368" y="322" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="368" dy="0">process each boundary once</tspan><tspan x="368" dy="17.55">stock · plants · rent · events</tspan></text><path d="M595,315 L650,315" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="265" width="245" height="100" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="678" y="295" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="678" dy="0">SAVE NEXT MORNING</tspan></text><text x="678" y="322" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="678" dy="0">one complete state revision</tspan><tspan x="678" dy="17.55">retry snapshot if write fails</tspan></text><rect x="660" y="85" width="245" height="100" rx="5" fill="#e0e8da" stroke="#c4cec2"/><text x="678" y="115" font-size="17" fill="#263e39" font-weight="bold" text-anchor="start"><tspan x="678" dy="0">MORNING 07:00</tspan></text><text x="678" y="142" font-size="13" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="678" dy="0">new day; safe home position</tspan><tspan x="678" dy="17.55">refresh resident plans</tspan></text><path d="M780,265 L780,190" fill="none" stroke="#263e39" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="420" font-size="15" fill="#62736a" font-weight="normal" text-anchor="start"><tspan x="35" dy="0">No wall-clock catch-up. Rendering may continue while simulation is paused.</tspan><tspan x="35" dy="20.25">Time waits for the player; obligations never accrue while the game is closed.</tspan></text></g></svg>